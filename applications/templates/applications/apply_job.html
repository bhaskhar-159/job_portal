<!DOCTYPE html>
<html>

<head>

    <title>Apply Job</title>

</head>

<body>

<h1>

Apply for {{ job.title }}

</h1>

<hr>

<form
    method="POST"
    enctype="multipart/form-data"
>

    {% csrf_token %}

    {{ form.as_p }}

    <button type="submit">

        Submit Application

    </button>

</form>

<br>

<a href="{% url 'job_detail' job.id %}">

Back

</a>

</body>

</html>
