<!DOCTYPE html>
<html>

<head>

<title>Update Status</title>

</head>

<body>

<h2>

Update Status

</h2>

<form method="POST">

{% csrf_token %}

<select name="status">

{% for value,label in choices %}

<option
value="{{ value }}"
{% if value == application.status %}
selected
{% endif %}
>

{{ label }}

</option>

{% endfor %}

</select>

<br><br>

<button>

Save

</button>

</form>

</body>

</html>
