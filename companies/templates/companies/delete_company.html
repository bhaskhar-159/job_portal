<!DOCTYPE html>
<html>

<head>
    <title>Delete Company</title>
</head>

<body>

<h2>Delete Company</h2>

<p>

Are you sure you want to delete

<strong>{{ company.name }}</strong>?

</p>

<form method="POST">

    {% csrf_token %}

    <button type="submit">

        Yes, Delete

    </button>

</form>

<br>

<a href="{% url 'company_detail' company.id %}">

Cancel

</a>

</body>

</html>
