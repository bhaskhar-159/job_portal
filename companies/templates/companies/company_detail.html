<!DOCTYPE html>
<html>

<head>
    <title>{{ company.name }}</title>
</head>

<body>

<h1>{{ company.name }}</h1>

<hr>

<p><strong>Description:</strong></p>

<p>{{ company.description }}</p>

<p><strong>Website:</strong></p>

<p>{{ company.website }}</p>

<p><strong>Email:</strong></p>

<p>{{ company.email }}</p>

<p><strong>Phone:</strong></p>

<p>{{ company.phone }}</p>

<p><strong>Location:</strong></p>

<p>{{ company.location }}</p>

{% if company.logo %}
    <img
        src="{{ company.logo.url }}"
        width="200">
{% endif %}

<br><br>

<a href="{% url 'company_update' company.id %}">Edit</a>

<br><br>

<a href="{% url 'company_delete' company.id %}">Delete</a>

<br><br>

<a href="{% url 'create_job' company.id %}">

<br><br>

<a href="{% url 'job_list' company.id %}">View Jobs</a>

<br><br>

<a href="{% url 'company_list' %}">Back</a>

</body>
</html>
